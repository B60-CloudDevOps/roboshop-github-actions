on:
  workflow_call:
    inputs:
      app_type:
        required: true
        type: string
      component:
        required: true
        type: string
jobs:
  nodejs:
    runs-on: self-hosted
    if: inputs.app_type == 'nodejs'
    steps:
      - uses: actions/checkout@v4
      - name: Generating Artifacts
        run: |
          npm install;
          IMAGE_TAG=$(git rev-parse --short HEAD)-${{ github.run_number }}
          docker build -t public.ecr.aws/w2x3d9u7/roboshop-60/${{ inputs.component }}:$IMAGE_TAG .
          docker images

  java:
    runs-on: self-hosted
    if: inputs.app_type == 'java'
    steps:
      - uses: actions/checkout@v4
      - name: Generating Artifacts
        run: |
          mvn compile ; 
          mvn clean package;
          mv target/${{ inputs.component }}-1.0.jar  ${{ inputs.component }}.jar 
          IMAGE_TAG=$(git rev-parse --short HEAD)-${{ github.run_number }}
          docker build -t public.ecr.aws/w2x3d9u7/roboshop-60/${{ inputs.component }}:$IMAGE_TAG .
          docker images
         
  python:
    runs-on: self-hosted
    if: inputs.app_type == 'python'
    steps:
      - uses: actions/checkout@v4
      - name: Generating Artifacts
        run: |
          pip3 install -r requirements.txt
          IMAGE_TAG=$(git rev-parse --short HEAD)-${{ github.run_number }}
          docker build -t public.ecr.aws/w2x3d9u7/roboshop-60/${{ inputs.component }}:$IMAGE_TAG .
          docker images
